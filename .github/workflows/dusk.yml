name: Dusk Tests

on:
  push:
  pull_request:

jobs:
  dusk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, gd

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare Dusk environment
        run: |
          cp .env.dusk.example .env.dusk
          sed -i "s|/chemin/absolu/vers/projet|${{ github.workspace }}|g" .env.dusk
          php artisan config:clear --env=dusk
          php artisan key:generate --env=dusk --force
          rm -f database/dusk.sqlite
          touch database/dusk.sqlite
          php artisan migrate:fresh --force --env=dusk
          php artisan db:seed --class=DuskSeeder --env=dusk

      - name: Install Chromium
        run: sudo apt-get update && sudo apt-get install -y chromium-browser

      - name: Install ChromeDriver
        run: php artisan dusk:chrome-driver --detect

      - name: Start application server
        run: |
          php artisan serve --env=dusk --host=127.0.0.1 --port=8000 &
          sleep 3

      - name: Run Dusk
        env:
          DUSK_CHROME_BINARY: /usr/bin/chromium-browser
        run: php artisan dusk --env=dusk tests/Browser/LoginTest.php tests/Browser/WalletTest.php tests/Browser/CommissionTest.php tests/Browser/PurchaseTest.php --without-tty
