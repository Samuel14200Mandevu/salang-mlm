name: Dusk Tests

on:
  push:
  pull_request:

jobs:
  dusk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, gd

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare Dusk environment
        run: |
          cp .env.dusk.example .env.dusk
          php artisan key:generate --env=dusk --force
          rm -f database/dusk.sqlite
          touch database/dusk.sqlite
          php artisan migrate:fresh --force --env=dusk

      - name: Install Chromium
        run: sudo apt-get update && sudo apt-get install -y chromium-browser

      - name: Install ChromeDriver
        run: php artisan dusk:chrome-driver --detect

      - name: Start application server
        run: php artisan serve --env=dusk --host=127.0.0.1 --port=8000 &

      - name: Run Dusk
        run: php artisan dusk tests/Browser/LoginTest.php tests/Browser/WalletTest.php tests/Browser/CommissionTest.php tests/Browser/PurchaseTest.php --without-tty
